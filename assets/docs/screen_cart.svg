<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a61e22"/>
      <stop offset="100%" stop-color="#83000f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="360" height="640" rx="36" fill="#FCF9F8" stroke="#a61e22" stroke-width="4"/>
  <rect x="130" y="14" width="100" height="18" rx="9" fill="#e0e0e0"/>

  <!-- Top Header -->
  <text x="24" y="58" font-family="sans-serif" font-size="20" font-weight="bold" fill="#83000f">Shopping Cart 🛒</text>
  
  <!-- Item 1 -->
  <rect x="24" y="74" width="312" height="74" rx="14" fill="#ffffff" stroke="#eee" filter="url(#shadow)"/>
  <text x="40" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1c">Super Supreme Family Pizza</text>
  <text x="40" y="124" font-family="sans-serif" font-size="13" font-weight="bold" fill="#83000f">65,000 SYP</text>
  <rect x="250" y="94" width="70" height="32" rx="16" fill="#EAE7E7"/>
  <text x="285" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1b1c" text-anchor="middle">1</text>

  <!-- Item 2 -->
  <rect x="24" y="160" width="312" height="74" rx="14" fill="#ffffff" stroke="#eee" filter="url(#shadow)"/>
  <text x="40" y="188" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1c">Fresh Orange Juice 1L (×2)</text>
  <text x="40" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#83000f">30,000 SYP</text>
  <rect x="250" y="180" width="70" height="32" rx="16" fill="#EAE7E7"/>
  <text x="285" y="201" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1b1c" text-anchor="middle">2</text>

  <!-- Delivery Details Card -->
  <text x="24" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1c">Delivery Details</text>
  <rect x="24" y="270" width="312" height="84" rx="14" fill="#ffffff" stroke="#e2bebb" filter="url(#shadow)"/>
  <text x="40" y="296" font-family="sans-serif" font-size="12" font-weight="bold" fill="#83000f">📍 Suwayda - Al-Ojeilat</text>
  <text x="40" y="316" font-family="sans-serif" font-size="11" fill="#666">Near Excellence School, Jasmine Bldg 3rd Fl</text>
  <text x="40" y="338" font-family="sans-serif" font-size="11" font-weight="bold" fill="#444">⏱ Estimated Delivery: 35-45 minutes</text>

  <!-- Invoice Breakdown Card -->
  <text x="24" y="378" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1c">Invoice Summary</text>
  <rect x="24" y="390" width="312" height="120" rx="14" fill="#ffffff" stroke="#eee" filter="url(#shadow)"/>
  <text x="40" y="416" font-family="sans-serif" font-size="12" fill="#555">Items Subtotal:</text>
  <text x="296" y="416" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1b1c" text-anchor="end">95,000 SYP</text>
  
  <text x="40" y="440" font-family="sans-serif" font-size="12" fill="#555">Delivery Fee:</text>
  <text x="296" y="440" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1b1c" text-anchor="end">3,000 SYP</text>

  <line x1="40" y1="454" x2="296" y2="454" stroke="#eee" stroke-width="1"/>
  
  <text x="40" y="478" font-family="sans-serif" font-size="14" font-weight="bold" fill="#83000f">Total Invoice:</text>
  <text x="296" y="478" font-family="sans-serif" font-size="16" font-weight="extrabold" fill="#83000f" text-anchor="end">98,000 SYP</text>

  <!-- Checkout Button -->
  <rect x="24" y="530" width="312" height="52" rx="14" fill="url(#brandRed)" filter="url(#shadow)"/>
  <text x="180" y="562" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Confirm &amp; Place Order ➔</text>
</svg>
