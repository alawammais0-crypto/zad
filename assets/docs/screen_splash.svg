<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a61e22"/>
      <stop offset="100%" stop-color="#83000f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D35E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="360" height="640" rx="36" fill="url(#splashBg)" stroke="#D4AF37" stroke-width="4"/>
  <rect x="130" y="14" width="100" height="18" rx="9" fill="#58000a"/>
  
  <!-- Animated Halo Ring -->
  <circle cx="180" cy="270" r="90" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="8,5"/>
  <circle cx="180" cy="270" r="76" fill="#6a000c" stroke="#D4AF37" stroke-width="3.5" filter="url(#shadow)"/>
  
  <!-- Emblem ZAD -->
  <text x="180" y="280" font-family="sans-serif" font-size="42" font-weight="900" fill="#D4AF37" text-anchor="middle" letter-spacing="4">ZAD</text>
  
  <!-- Main Title -->
  <text x="180" y="390" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">ZAD</text>
  <text x="180" y="420" font-family="sans-serif" font-size="14" fill="#F4D35E" text-anchor="middle" letter-spacing="1">Suwayda Premium Food Delivery</text>

  <!-- Button -->
  <rect x="60" y="490" width="240" height="52" rx="14" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="180" y="523" font-family="sans-serif" font-size="16" font-weight="bold" fill="#83000f" text-anchor="middle">Get Started ➔</text>

  <!-- Loading Bar -->
  <rect x="90" y="580" width="180" height="3" rx="1.5" fill="rgba(212,175,55,0.2)"/>
  <rect x="90" y="580" width="110" height="3" rx="1.5" fill="#D4AF37"/>
</svg>
