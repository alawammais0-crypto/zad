<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a61e22"/>
      <stop offset="100%" stop-color="#83000f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="360" height="640" rx="36" fill="#FCF9F8" stroke="#a61e22" stroke-width="4"/>
  <rect x="130" y="14" width="100" height="18" rx="9" fill="#e0e0e0"/>

  <text x="24" y="58" font-family="sans-serif" font-size="20" font-weight="bold" fill="#83000f">My Orders 🛵</text>

  <!-- Segmented Control Tabs -->
  <rect x="24" y="74" width="312" height="38" rx="19" fill="#EAE7E7"/>
  <rect x="28" y="78" width="150" height="30" rx="15" fill="#83000f"/>
  <text x="103" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Active Orders (1)</text>
  <text x="256" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">Order History (2)</text>

  <!-- Active Order Card -->
  <rect x="24" y="128" width="312" height="360" rx="18" fill="#ffffff" stroke="#e2bebb" filter="url(#shadow)"/>
  
  <text x="40" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1b1b1c">Royal Palace Restaurant</text>
  <text x="40" y="178" font-family="sans-serif" font-size="11" fill="#888">Order #YF-8921 • Today, 01:15 PM</text>
  
  <rect x="214" y="146" width="106" height="26" rx="13" fill="rgba(131,0,15,0.1)"/>
  <text x="267" y="163" font-family="sans-serif" font-size="10" font-weight="bold" fill="#83000f" text-anchor="middle">On The Way 🛵</text>

  <!-- Progress Bar Box -->
  <rect x="40" y="200" width="280" height="60" rx="12" fill="#F6F3F2"/>
  <text x="52" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#83000f">Est. Arrival Time: 15-20 min</text>
  <text x="240" y="222" font-family="sans-serif" font-size="10" fill="#777">Step 3 of 3</text>
  
  <rect x="52" y="234" width="256" height="8" rx="4" fill="#ccc"/>
  <rect x="52" y="234" width="200" height="8" rx="4" fill="#83000f"/>

  <!-- Items Breakdown -->
  <text x="40" y="284" font-family="sans-serif" font-size="12" fill="#333">1× Super Supreme Family Pizza</text>
  <text x="40" y="304" font-family="sans-serif" font-size="12" fill="#333">2× Fresh Orange Juice 1L</text>

  <line x1="40" y1="320" x2="320" y2="320" stroke="#eee" stroke-width="1"/>

  <text x="40" y="342" font-family="sans-serif" font-size="11" fill="#777">📍 Suwayda - Al-Ojeilat</text>
  <text x="320" y="342" font-family="sans-serif" font-size="15" font-weight="extrabold" fill="#83000f" text-anchor="end">98,000 SYP</text>

  <!-- Action Buttons -->
  <rect x="40" y="364" width="280" height="44" rx="10" fill="#83000f"/>
  <text x="180" y="391" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📞 Call Delivery Driver</text>

  <rect x="40" y="418" width="280" height="40" rx="10" fill="#EAE7E7"/>
  <text x="180" y="443" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ba1a1a" text-anchor="middle">Cancel Order</text>
</svg>
